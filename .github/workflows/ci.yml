# Generated by postman-repo-sync-action on the first onboarding run, then taken
# over by this repo (onboarding now runs with generate-ci-workflow: false).
#
# Change from the generated version: a test-target switch.
#   vars.CI_TARGET = mock  -> run Smoke/Contract against vars.POSTMAN_MOCK_URL
#   vars.CI_TARGET unset   -> run against the environment's real baseUrl (prod)
# Use "mock" until the platform team provides reachable URLs and CI credentials.
# In mock mode the test steps are advisory (continue-on-error): failures show as
# annotations on the run but don't turn the pipeline red.
name: CI/CD Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
concurrency:
  group: postman-onboard-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HAS_SSL_CERT: ${{ secrets.POSTMAN_SSL_CLIENT_CERT_B64 != '' }}
      CI_TARGET: ${{ vars.CI_TARGET }}
      POSTMAN_MOCK_URL: ${{ vars.POSTMAN_MOCK_URL }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Postman CLI
        env:
          POSTMAN_CLI_INSTALL_URL: https://dl-cli.pstmn.io/install/unix.sh
        run: curl -fsSL "$POSTMAN_CLI_INSTALL_URL" | sh
      - name: Login to Postman CLI
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: postman login --with-api-key "$POSTMAN_API_KEY"
      - name: Resolve Postman Resource IDs
        run: |
          ruby <<'RUBY'
          require 'yaml'
          config = YAML.load_file('.postman/resources.yaml') || {}
          cloud = config.fetch('canonical', config.fetch('cloudResources', {}))
          collections = cloud.fetch('collections', {})
          environments = cloud.fetch('environments', {})
          smoke = collections.find { |path, _| path.include?('[Smoke]') }&.last
          contract = collections.find { |path, _| path.include?('[Contract]') }&.last
          expected_environment = 'payment-refund-api - prod.environment.yaml'
          environment = environments.find { |path, _| File.basename(path) == expected_environment }&.last unless expected_environment.empty?
          environment ||= environments.find { |path, _| File.basename(path) == 'prod.postman_environment.json' }&.last
          environment ||= environments.values.first if environments.size == 1
          missing = []
          missing << '[Smoke] collection' unless smoke
          missing << '[Contract] collection' unless contract
          missing << (expected_environment.empty? ? 'environment' : expected_environment) unless environment
          abort("Missing Postman resource IDs in .postman/resources.yaml: #{missing.join(', ')}") unless missing.empty?
          File.open(ENV.fetch('GITHUB_ENV'), 'a') do |file|
            file.puts("POSTMAN_SMOKE_COLLECTION_UID=#{smoke}")
            file.puts("POSTMAN_CONTRACT_COLLECTION_UID=#{contract}")
            file.puts("POSTMAN_ENVIRONMENT_UID=#{environment}")
          end
          RUBY
      - name: Decode SSL certificates
        if: ${{ env.HAS_SSL_CERT == 'true' }}
        env:
          POSTMAN_SSL_CLIENT_CERT_B64: ${{ secrets.POSTMAN_SSL_CLIENT_CERT_B64 }}
          POSTMAN_SSL_CLIENT_KEY_B64: ${{ secrets.POSTMAN_SSL_CLIENT_KEY_B64 }}
          POSTMAN_SSL_EXTRA_CA_CERTS_B64: ${{ secrets.POSTMAN_SSL_EXTRA_CA_CERTS_B64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/postman-ssl"
          printf %s "$POSTMAN_SSL_CLIENT_CERT_B64" | base64 -d > "$RUNNER_TEMP/postman-ssl/client.crt"
          printf %s "$POSTMAN_SSL_CLIENT_KEY_B64" | base64 -d > "$RUNNER_TEMP/postman-ssl/client.key"
          if [ -n "$POSTMAN_SSL_EXTRA_CA_CERTS_B64" ]; then
            printf %s "$POSTMAN_SSL_EXTRA_CA_CERTS_B64" | base64 -d > "$RUNNER_TEMP/postman-ssl/ca.crt"
          fi
      - name: Run Smoke Tests
        # Advisory against the mock (multi-example endpoints are not deterministic);
        # blocking again once CI_TARGET points at a real environment.
        continue-on-error: ${{ vars.CI_TARGET == 'mock' }}
        env:
          CI_ENVIRONMENT: ${{ vars.CI_ENVIRONMENT || 'Production' }}
          POSTMAN_SSL_CLIENT_PASSPHRASE: ${{ secrets.POSTMAN_SSL_CLIENT_PASSPHRASE }}
        run: |
          CMD=(postman collection run "$POSTMAN_SMOKE_COLLECTION_UID"
            -e "$POSTMAN_ENVIRONMENT_UID"
            --report-events
            --env-var "CI_ENVIRONMENT=$CI_ENVIRONMENT")
          if [ "$CI_TARGET" = "mock" ]; then
            [ -n "$POSTMAN_MOCK_URL" ] || { echo "::error::CI_TARGET=mock but POSTMAN_MOCK_URL is not set"; exit 1; }
            echo "::notice::Testing against mock: $POSTMAN_MOCK_URL"
            CMD+=(--env-var "baseUrl=$POSTMAN_MOCK_URL")
          fi
          if [ -f "$RUNNER_TEMP/postman-ssl/client.crt" ]; then
            CMD+=(--ssl-client-cert "$RUNNER_TEMP/postman-ssl/client.crt"
              --ssl-client-key "$RUNNER_TEMP/postman-ssl/client.key")
            if [ -n "$POSTMAN_SSL_CLIENT_PASSPHRASE" ]; then
              CMD+=(--ssl-client-passphrase "$POSTMAN_SSL_CLIENT_PASSPHRASE")
            fi
            if [ -f "$RUNNER_TEMP/postman-ssl/ca.crt" ]; then
              CMD+=(--ssl-extra-ca-certs "$RUNNER_TEMP/postman-ssl/ca.crt")
            fi
          fi
          "${CMD[@]}"
      - name: Run Contract Tests
        continue-on-error: ${{ vars.CI_TARGET == 'mock' }}
        env:
          CI_ENVIRONMENT: ${{ vars.CI_ENVIRONMENT || 'Production' }}
          POSTMAN_SSL_CLIENT_PASSPHRASE: ${{ secrets.POSTMAN_SSL_CLIENT_PASSPHRASE }}
        run: |
          CMD=(postman collection run "$POSTMAN_CONTRACT_COLLECTION_UID"
            -e "$POSTMAN_ENVIRONMENT_UID"
            --report-events
            --env-var "CI_ENVIRONMENT=$CI_ENVIRONMENT")
          if [ "$CI_TARGET" = "mock" ]; then
            [ -n "$POSTMAN_MOCK_URL" ] || { echo "::error::CI_TARGET=mock but POSTMAN_MOCK_URL is not set"; exit 1; }
            echo "::notice::Testing against mock: $POSTMAN_MOCK_URL"
            CMD+=(--env-var "baseUrl=$POSTMAN_MOCK_URL")
          fi
          if [ -f "$RUNNER_TEMP/postman-ssl/client.crt" ]; then
            CMD+=(--ssl-client-cert "$RUNNER_TEMP/postman-ssl/client.crt"
              --ssl-client-key "$RUNNER_TEMP/postman-ssl/client.key")
            if [ -n "$POSTMAN_SSL_CLIENT_PASSPHRASE" ]; then
              CMD+=(--ssl-client-passphrase "$POSTMAN_SSL_CLIENT_PASSPHRASE")
            fi
            if [ -f "$RUNNER_TEMP/postman-ssl/ca.crt" ]; then
              CMD+=(--ssl-extra-ca-certs "$RUNNER_TEMP/postman-ssl/ca.crt")
            fi
          fi
          "${CMD[@]}"
