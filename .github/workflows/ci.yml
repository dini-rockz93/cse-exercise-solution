# Smoke + contract tests for the service onboarded in this repo.
#
# Originally generated by postman-repo-sync on the first onboarding run, now owned
# here (onboarding runs with generate-ci-workflow: false so reruns don't overwrite it).
#
# Scope: ONE service per repo (vars.SERVICE_NAME, default payment-refund-api).
# Collection and environment IDs are resolved for that service from
# .postman/resources.yaml, never "first match".
#
# Target (vars.CI_TARGET) must be set explicitly. Production is never a CI target,
# because the smoke collection includes write calls (POST /refunds, cancel):
#   mock -> the service's dev environment with baseUrl overridden to vars.POSTMAN_MOCK_URL.
#           Smoke/contract are advisory (see the job summary); the POST /refunds
#           happy path is checked explicitly and is blocking.
#   dev  -> the service's dev environment as-is. All checks are blocking.
# Read-only production probes, if wanted, belong in a separate GET-only collection/job.
name: CI/CD Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
concurrency:
  group: postman-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HAS_SSL_CERT: ${{ secrets.POSTMAN_SSL_CLIENT_CERT_B64 != '' }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME || 'payment-refund-api' }}
      CI_TARGET: ${{ vars.CI_TARGET }}
      POSTMAN_MOCK_URL: ${{ vars.POSTMAN_MOCK_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Check test target
        run: |
          case "$CI_TARGET" in
            mock)
              [ -n "$POSTMAN_MOCK_URL" ] || { echo "::error::CI_TARGET=mock but POSTMAN_MOCK_URL is not set"; exit 1; }
              case "$POSTMAN_MOCK_URL" in https://*.mock.pstmn.io/*) ;; *) echo "::error::POSTMAN_MOCK_URL must be a https://<id>.mock.pstmn.io/<base path> URL"; exit 1;; esac
              echo "::notice::Target: mock ($POSTMAN_MOCK_URL). Smoke/contract are advisory; the create-refund happy path is blocking." ;;
            dev)
              echo "::notice::Target: dev environment of $SERVICE_NAME. All checks are blocking." ;;
            *)
              echo "::error::Set repository variable CI_TARGET to 'mock' or 'dev'. Production is never a CI target (the smoke collection makes write calls)."
              exit 1 ;;
          esac

      - name: Install Postman CLI
        env:
          POSTMAN_CLI_INSTALL_URL: https://dl-cli.pstmn.io/install/unix.sh
        run: curl -fsSL "$POSTMAN_CLI_INSTALL_URL" | sh

      - name: Login to Postman CLI
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: postman login --with-api-key "$POSTMAN_API_KEY"

      - name: Resolve Postman resource IDs for this service
        run: |
          ruby <<'RUBY'
          require 'yaml'
          service = ENV.fetch('SERVICE_NAME')
          config = YAML.load_file('.postman/resources.yaml') || {}
          cloud = config.fetch('canonical', config.fetch('cloudResources', {}))
          collections = cloud.fetch('collections', {})
          environments = cloud.fetch('environments', {})
          pick = ->(map, name) { map.find { |path, _| File.basename(path) == name }&.last }
          smoke = pick.(collections, "[Smoke] #{service}")
          contract = pick.(collections, "[Contract] #{service}")
          env_file = "#{service} - dev.environment.yaml"   # mock and dev both use the dev environment
          environment = pick.(environments, env_file)
          missing = []
          missing << "[Smoke] #{service}" unless smoke
          missing << "[Contract] #{service}" unless contract
          missing << env_file unless environment
          abort("Missing Postman resource IDs in .postman/resources.yaml: #{missing.join(', ')}") unless missing.empty?
          File.open(ENV.fetch('GITHUB_ENV'), 'a') do |f|
            f.puts("POSTMAN_SMOKE_COLLECTION_UID=#{smoke}")
            f.puts("POSTMAN_CONTRACT_COLLECTION_UID=#{contract}")
            f.puts("POSTMAN_ENVIRONMENT_UID=#{environment}")
          end
          RUBY

      - name: Decode SSL certificates
        if: ${{ env.HAS_SSL_CERT == 'true' }}
        env:
          POSTMAN_SSL_CLIENT_CERT_B64: ${{ secrets.POSTMAN_SSL_CLIENT_CERT_B64 }}
          POSTMAN_SSL_CLIENT_KEY_B64: ${{ secrets.POSTMAN_SSL_CLIENT_KEY_B64 }}
          POSTMAN_SSL_EXTRA_CA_CERTS_B64: ${{ secrets.POSTMAN_SSL_EXTRA_CA_CERTS_B64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/postman-ssl"
          printf %s "$POSTMAN_SSL_CLIENT_CERT_B64" | base64 -d > "$RUNNER_TEMP/postman-ssl/client.crt"
          printf %s "$POSTMAN_SSL_CLIENT_KEY_B64" | base64 -d > "$RUNNER_TEMP/postman-ssl/client.key"
          if [ -n "$POSTMAN_SSL_EXTRA_CA_CERTS_B64" ]; then
            printf %s "$POSTMAN_SSL_EXTRA_CA_CERTS_B64" | base64 -d > "$RUNNER_TEMP/postman-ssl/ca.crt"
          fi

      - name: Mock happy path (POST /refunds -> 201)
        # The mock has 9 examples for POST /refunds with identical requests, so the
        # generated smoke run may get any of them. Here we ask for the 201 example
        # explicitly and check its shape. Deterministic, so this step is blocking.
        if: ${{ env.CI_TARGET == 'mock' }}
        run: |
          body='{"transactionId":"txn_1234567890abcdef","reason":"Customer requested refund","notifyCustomer":true}'
          code=$(curl -sS -o "$RUNNER_TEMP/happy.json" -w '%{http_code}' -X POST "$POSTMAN_MOCK_URL/refunds" \
            -H 'Content-Type: application/json' -H 'x-mock-response-code: 201' -d "$body")
          echo "POST /refunds -> $code"
          [ "$code" = "201" ] || { echo "::error::Expected 201 from the mock, got $code"; exit 1; }
          jq -e '.refundId and .transactionId and (.status | type == "string")' "$RUNNER_TEMP/happy.json" >/dev/null \
            || { echo "::error::201 body missing refundId/transactionId/status"; exit 1; }
          echo "HAPPY_PATH=passed (201, refundId=$(jq -r .refundId "$RUNNER_TEMP/happy.json"))" >> "$GITHUB_ENV"

      - name: Run Smoke Tests
        id: smoke
        continue-on-error: ${{ vars.CI_TARGET == 'mock' }}
        env:
          POSTMAN_SSL_CLIENT_PASSPHRASE: ${{ secrets.POSTMAN_SSL_CLIENT_PASSPHRASE }}
        run: |
          CMD=(postman collection run "$POSTMAN_SMOKE_COLLECTION_UID" -e "$POSTMAN_ENVIRONMENT_UID"
            --report-events --reporters "cli,junit" --reporter-junit-export "$RUNNER_TEMP/smoke.xml")
          [ "$CI_TARGET" = "mock" ] && CMD+=(--env-var "baseUrl=$POSTMAN_MOCK_URL")
          if [ -f "$RUNNER_TEMP/postman-ssl/client.crt" ]; then
            CMD+=(--ssl-client-cert "$RUNNER_TEMP/postman-ssl/client.crt" --ssl-client-key "$RUNNER_TEMP/postman-ssl/client.key")
            [ -n "$POSTMAN_SSL_CLIENT_PASSPHRASE" ] && CMD+=(--ssl-client-passphrase "$POSTMAN_SSL_CLIENT_PASSPHRASE")
            [ -f "$RUNNER_TEMP/postman-ssl/ca.crt" ] && CMD+=(--ssl-extra-ca-certs "$RUNNER_TEMP/postman-ssl/ca.crt")
          fi
          "${CMD[@]}"

      - name: Run Contract Tests
        id: contract
        continue-on-error: ${{ vars.CI_TARGET == 'mock' }}
        env:
          POSTMAN_SSL_CLIENT_PASSPHRASE: ${{ secrets.POSTMAN_SSL_CLIENT_PASSPHRASE }}
        run: |
          CMD=(postman collection run "$POSTMAN_CONTRACT_COLLECTION_UID" -e "$POSTMAN_ENVIRONMENT_UID"
            --report-events --reporters "cli,junit" --reporter-junit-export "$RUNNER_TEMP/contract.xml")
          [ "$CI_TARGET" = "mock" ] && CMD+=(--env-var "baseUrl=$POSTMAN_MOCK_URL")
          if [ -f "$RUNNER_TEMP/postman-ssl/client.crt" ]; then
            CMD+=(--ssl-client-cert "$RUNNER_TEMP/postman-ssl/client.crt" --ssl-client-key "$RUNNER_TEMP/postman-ssl/client.key")
            [ -n "$POSTMAN_SSL_CLIENT_PASSPHRASE" ] && CMD+=(--ssl-client-passphrase "$POSTMAN_SSL_CLIENT_PASSPHRASE")
            [ -f "$RUNNER_TEMP/postman-ssl/ca.crt" ] && CMD+=(--ssl-extra-ca-certs "$RUNNER_TEMP/postman-ssl/ca.crt")
          fi
          "${CMD[@]}"

      - name: Test summary
        if: always()
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          CONTRACT_OUTCOME: ${{ steps.contract.outcome }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os, xml.etree.ElementTree as ET
          tmp = os.environ["RUNNER_TEMP"]; target = os.environ.get("CI_TARGET") or "(not set)"
          mode = "advisory: failures are reported, not blocking" if target == "mock" else "blocking"
          print(f"## Postman tests: {os.environ['SERVICE_NAME']}")
          print(f"- **Target:** `{target}` ({mode}). Production is never a CI target.")
          if target == "mock":
              print(f"- **Mock happy path (POST /refunds, 201):** {os.environ.get('HAPPY_PATH', 'FAILED or not run')}")
          for name, outcome in (("smoke", os.environ.get("SMOKE_OUTCOME")), ("contract", os.environ.get("CONTRACT_OUTCOME"))):
              path = os.path.join(tmp, f"{name}.xml")
              if not os.path.exists(path):
                  print(f"\n### {name.title()}: no report (step outcome: {outcome or 'not run'})"); continue
              root = ET.parse(path).getroot()
              suites = root.iter("testsuite")
              tests = fails = errs = 0; failing = []
              for s in suites:
                  tests += int(s.get("tests", 0)); fails += int(s.get("failures", 0)); errs += int(s.get("errors", 0))
                  for c in s.iter("testcase"):
                      for kind in ("failure", "error"):
                          el = c.find(kind)
                          if el is not None:
                              raw = (el.get("message") or el.text or "").strip()
                              msg = raw.splitlines()[0][:140] if raw else ""
                              failing.append(f"{kind}: {s.get('name','?')} › {c.get('name','?')}" + (f" — {msg}" if msg else ""))
              print(f"\n### {name.title()}: {tests - fails - errs}/{tests} passed · {fails} assertion failures · {errs} request errors (step: {outcome})")
              for line in sorted(set(failing))[:15]:
                  print(f"- {line}")
          print("\n_Advisory steps show a green check even when they fail; read the counts above._")
          PY
