name: Check secrets

# Preflight: verifies the repo secrets the onboarding workflow depends on,
# exactly as GitHub Actions sees them. Run before onboarding a new service.

on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Postman API key
        env:
          PMAK: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          test -n "$PMAK" || { echo "::error::POSTMAN_API_KEY is empty or not set"; exit 1; }
          curl -s https://api.getpostman.com/me -H "X-Api-Key: $PMAK" \
            | jq -e '.user | {id, teamName}' || { echo "::error::POSTMAN_API_KEY was rejected by Postman"; exit 1; }

      - name: GitHub PAT
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          test -n "$GH_TOKEN" || { echo "::error::GH_PAT is empty or not set"; exit 1; }
          gh api repos/${{ github.repository }} --jq '"PAT can access \(.full_name)"'
